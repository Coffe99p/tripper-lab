name: Validar entrega 0.6.0
on:
  push:
    branches: [validacao/entrega-0.6.0]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05526cb20ce1c93eb3a2beddfa6ca3833a24ac8a
          persist-credentials: false
      - name: Preparar o SDK e o JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Executar os comandos do README e conferir os relatórios
        run: |
          sh ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/reports/tests/testDebugUnitTest/index.html
          test -s app/build/reports/lint-results-debug.html
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          roots=[ET.parse(x).getroot() for x in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          for root in roots: print(root.get('name'), root.get('tests'), 'testes')
          counts={k:sum(int(x.get(k,0)) for x in roots) for k in ('tests','skipped','errors','failures')}
          print(counts)
          assert counts == dict(tests=50,skipped=0,errors=0,failures=0)
          issues=ET.parse('app/build/reports/lint-results-debug.xml').findall('issue')
          print('Lint:', len(issues), 'ocorrências')
          assert not issues
          PY
      - name: Iniciar Android virtual
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDK/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-34;default;x86_64'
          echo no | "$SDK/avdmanager" create avd --name entrega --package 'system-images;android-34;default;x86_64'
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd entrega -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 -partition-size 2048 < /dev/null > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emupid=$!
          trap 'tail -60 "$RUNNER_TEMP/emulator.log"' ERR
          for _ in {1..60}; do
            kill -0 "$emupid" || { tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }
            if adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device"; then break; fi
            sleep 2
          done
          timeout 300 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          adb shell wm dismiss-keyguard
      - name: Instalar o APK e navegar nas telas
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell wm size 1080x2400
          adb shell wm density 320
          adb shell monkey -p com.joaofabijack.tripper -c android.intent.category.LAUNCHER 1
          python3 - <<'PY'
          import re,subprocess,time,xml.etree.ElementTree as ET
          def adb(*args):
              return subprocess.check_output(['adb',*map(str,args)])
          def find(view):
              for _ in range(8):
                  adb('shell','uiautomator','dump','/data/local/tmp/entrega.xml')
                  root=ET.fromstring(adb('exec-out','cat','/data/local/tmp/entrega.xml'))
                  node=root.find(".//node[@resource-id='com.joaofabijack.tripper:id/"+view+"']")
                  if node is not None: return node
                  time.sleep(.5)
              raise ValueError('Controle ausente: '+view)
          def tap(view):
              coords=list(map(int,re.findall(r'\d+',find(view).attrib['bounds'])))
              adb('shell','input','tap',(coords[0]+coords[2])//2,(coords[1]+coords[3])//2)
          print('Versão:',find('app_version').get('text'))
          tap('home_help');find('help_root');tap('help_back');find('home_access_status')
          print('Ajuda e retorno OK')
          tap('tools_toggle');tap('home_battery');find('battery_baseline');adb('shell','input','keyevent',4)
          print('Medição de bateria e retorno OK')
          tap('home_diagnostics');find('maps_access_status');tap('maps_bluetooth');find('home_access_status')
          print('Diagnóstico e retorno OK')
          PY

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Clonar o repositório privado em uma pasta vazia
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git clone https://github.com/Coffe99p/tripper-lab.git
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location tripper-lab
          git checkout --detach 05526cb20ce1c93eb3a2beddfa6ca3833a24ac8a
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path local.properties) { throw 'Configuração local inesperada no clone' }
      - name: Compilar, executar JUnit e lint pelo script do README
        shell: pwsh
        working-directory: tripper-lab
        run: |
          $env:JAVA_HOME=$env:JAVA_HOME_17_X64
          $sdk=$env:ANDROID_HOME
          & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdkPath=$sdk.Replace('\','/')
          (Get-Content local.properties.example) -replace '^sdk.dir=.*$',"sdk.dir=$sdkPath" | Set-Content local.properties -Encoding ascii
          .\scripts\build.ps1
          foreach ($file in @('app/build/outputs/apk/debug/app-debug.apk','app/build/reports/tests/testDebugUnitTest/index.html','app/build/reports/lint-results-debug.html')) {
            if (!(Test-Path -PathType Leaf $file)) { throw "Arquivo ausente $file" }
          }
          $total=0
          foreach ($file in Get-ChildItem app/build/test-results/testDebugUnitTest/TEST-*.xml) {
            $suite=([xml](Get-Content -Raw $file)).testsuite
            if (([int]$suite.errors + [int]$suite.failures + [int]$suite.skipped) -ne 0) { throw "Falha na suíte $($suite.name)" }
            $total += [int]$suite.tests
          }
          if ($total -ne 50) { throw "Contagem inesperada de testes: $total" }
          Write-Host "$total testes aprovados"
